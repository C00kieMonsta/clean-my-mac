name: Build macOS downloads

on:
  workflow_dispatch:
    inputs:
      sign_and_notarize:
        description: Sign and notarize for public distribution. Requires all Apple secrets in the release guide.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin

    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check signing configuration
        shell: bash
        env:
          SIGN_AND_NOTARIZE: ${{ inputs.sign_and_notarize }}
        run: |
          if [[ "$SIGN_AND_NOTARIZE" != "true" ]]; then
            echo "Building ad-hoc signed review artifacts. These are not public downloads."
            for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$key=" >> "$GITHUB_ENV"
            done
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            exit 0
          fi

          missing=()
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Signed release requested, but required Actions secrets are missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust target
        run: rustup target add "${{ matrix.rust-target }}"

      - name: Checks
        if: matrix.arch == 'aarch64'
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Import Apple Developer ID certificate
        if: inputs.sign_and_notarize
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build DMG
        run: pnpm desktop:build --bundles dmg

      - name: Attach DMG for review
        uses: actions/upload-artifact@v4
        with:
          name: clean-my-mac-macos-${{ matrix.arch }}-${{ inputs.sign_and_notarize && 'signed' || 'adhoc' }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
