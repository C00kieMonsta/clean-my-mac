[package]
name = "clean-my-mac"
version = "0.2.1"
description = "A careful storage cleaner for macOS"
authors = ["Clean My Mac"]
edition = "2024"

[lib]
name = "clean_my_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clean-my-mac"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2"
sysinfo = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Directory hashing is CPU intensive on large Cargo and package-cache trees.
# Keep local app builds responsive without optimizing all dependencies.
[profile.dev.package.clean-my-mac]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
